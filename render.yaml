# Render Blueprint: one free web service running Server/server.js, which serves the
# web build (docs/, committed to the repo) and the game's WebSocket at /ws.
# Render gives it the PORT to listen on. Kept compatible with the old PixelLeap service.
services:
  - type: web
    name: pixelleap
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node Server/server.js
    healthCheckPath: /status
    autoDeploy: true
