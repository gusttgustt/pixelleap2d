<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Island Survival</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1c2c; }
    body { font-family: "Kanit", "Leelawadee UI", "Tahoma", sans-serif; color: #f5e6b8; }
    /* The game fills the whole browser window at any size; Unity follows the canvas size. */
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
    #loading h1 { margin: 0; font-size: clamp(24px, 6vw, 44px); color: #ffe08a; text-shadow: 2px 2px 0 #000; }
    #bar { width: min(360px, 80vw); height: 14px; border: 2px solid #ffe08a; background: #1d3347; }
    #fill { width: 0; height: 100%; background: #ffd34d; transition: width .2s; }
    #msg { font-size: 15px; opacity: .85; }
    /* Small hint at the top middle: never covers the touch buttons or the bag, can't be tapped, fades away. */
    #note { position: fixed; top: 34px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); box-sizing: border-box;
            padding: 6px 14px; border-radius: 14px; font-size: 13px; text-align: center; background: rgba(0,0,0,.6);
            pointer-events: none; opacity: 0; transition: opacity .6s; }
    #note.show { opacity: 1; }
    #error { color: #ff9a8a; }
    /* Phones: full screen + landscape. The browser's bars eat half the height of a phone held sideways. */
    #full { position: fixed; left: max(6px, env(safe-area-inset-left)); bottom: 6px; display: none; z-index: 5;
            padding: 3px 10px; border: 1px solid rgba(255,224,138,.7); border-radius: 12px; background: rgba(0,0,0,.55);
            color: #ffe08a; font: 13px "Kanit", "Tahoma", sans-serif; }
    #full.show { display: block; }
    /* "What's new": shown on every page load until closed for today; a new update shows again. */
    #news { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
            padding: 16px; background: rgba(0,0,0,.55); }
    #news.show { display: flex; }
    #news .card { width: min(440px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column;
                  box-sizing: border-box; padding: 16px 18px 14px; border: 2px solid #ffd34d; border-radius: 14px;
                  background: #1b2a38; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    #news h2 { margin: 0 0 2px; font-size: 20px; color: #ffe08a; }
    #news .date { font-size: 13px; opacity: .7; margin-bottom: 10px; }
    #news ul { margin: 0; padding: 0 4px 0 20px; overflow-y: auto; font-size: 14px; line-height: 1.55; color: #f5e6b8; }
    #news li { margin-bottom: 6px; }
    #news li b { color: #ffe08a; font-weight: normal; }
    #news .btns { display: flex; gap: 8px; margin-top: 14px; }
    #news button { flex: 1; min-height: 40px; border-radius: 10px; font: 14px "Kanit", "Tahoma", sans-serif; cursor: pointer; }
    #news .ok { border: 0; background: #ffd34d; color: #1b2a38; }
    #news .later { border: 1px solid rgba(255,224,138,.6); background: transparent; color: #ffe08a; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading">
    <h1>Island Survival</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">กำลังโหลดเกม...</div>
  </div>
  <div id="note"></div>
  <button id="full" type="button">⛶ เต็มจอแนวนอน</button>
  <div id="news" role="dialog" aria-modal="true" aria-labelledby="news-title">
    <div class="card">
      <h2 id="news-title">มีอะไรใหม่</h2>
      <div class="date" id="news-date"></div>
      <ul id="news-list"></ul>
      <div class="btns">
        <button type="button" class="later" id="news-today">วันนี้ไม่ต้องแสดงอีก</button>
        <button type="button" class="ok" id="news-ok">ปิด</button>
      </div>
    </div>
  </div>
  <script>
    var canvas = document.getElementById("game");
    var note = document.getElementById("note");
    var touch = matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;

    // Phones held upright: suggest landscape for a bigger view, for a few seconds only.
    var wasPortrait = false, noteTimer = 0;
    function updateNote() {
      var portrait = touch && window.innerHeight > window.innerWidth;
      if (portrait && !wasPortrait) {
        note.textContent = "หมุนจอเป็นแนวนอนจะเห็นเกมกว้างขึ้น";
        note.classList.add("show");
        clearTimeout(noteTimer);
        noteTimer = setTimeout(function () { note.classList.remove("show"); }, 4000);
      }
      if (!portrait) note.classList.remove("show");
      wasPortrait = portrait;
    }
    window.addEventListener("resize", updateNote);
    updateNote();

    // Full screen + landscape for phones: more room for the game, and the screen stays sideways
    // (Android). iPhones can't lock the screen, but the game follows whichever way it's held.
    var full = document.getElementById("full");
    function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function updateFull() { full.classList.toggle("show", touch && !isFull()); }
    full.addEventListener("click", function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = req ? req.call(el, { navigationUI: "hide" }) : null;
      function lock() {
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
      }
      if (p && p.then) p.then(lock).catch(lock); else lock();
      setTimeout(fitCanvas, 300);
    });
    document.addEventListener("fullscreenchange", function () { updateFull(); fitCanvas(); });
    document.addEventListener("webkitfullscreenchange", function () { updateFull(); fitCanvas(); });
    updateFull();

    // Turning the phone: make sure the canvas takes the new size (some phones report it late).
    function fitCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", fitCanvas);
    window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 250); setTimeout(fitCanvas, 800); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCanvas);
    fitCanvas();

    function showBanner(msg, type) {
      if (type === "error") { document.getElementById("msg").innerHTML = '<span id="error">' + msg + "</span>"; }
      else console.warn(msg);
    }

    // ---------- "What's new" ----------
    // Each release: put the newest update FIRST with a new id. Players see it every time they open or
    // refresh the page, until they press "วันนี้ไม่ต้องแสดงอีก" (hidden for the rest of that day only).
    // A new id shows again straight away, even on a day they hid the old one.
    var UPDATES = [
      { id: "2026-11-17b", date: "17 พ.ย. 2569", items: [
        "<b>ปลุกพลังผลไม้ (เลเวล 60)</b> ได้สกิลใหม่ กด Y แล้วได้บัพตามสายผลไม้ มีออร่าสีของผลไม้รอบตัว สกิล R กับ T คูลดาวน์เหลือ 0.5 วิ โจมตีแรงขึ้น ไกลขึ้น กว้างขึ้น",
        "<b>คลิกขวาไล่ท่าให้เอง</b> ใช้พลัง R ก่อน ถ้าติดคูลดาวน์จะใช้ท่าพิเศษ T แล้วตามด้วยปลุกพลัง Y",
        "<b>ตัดพุ่มไม้และต้นผลไม้ได้</b> เก็บผลหมดแล้วใช้ขวานฟันเอาไม้ แล้วต้นใหม่จะไปงอกที่อื่นบนเกาะ",
        "<b>ตั้งค่า</b> ปุ่มฟันเฟืองมุมขวาบน และเห็นเรือของผู้เล่นคนอื่นกลางทะเล",
      ] },
      { id: "2026-11-17", date: "17 พ.ย. 2569", items: [
        "<b>ระบบบัญชีผู้เล่น</b> สมัครและเข้าสู่ระบบที่หน้าแรก แล้วเล่นตัวละครเดิมได้จากทุกเครื่อง",
        "<b>ช่วยทำฟาร์มบ้านเพื่อน</b> ปลูก รดน้ำ เก็บเกี่ยว ให้อาหารสัตว์ได้ ของที่เก็บได้ เพื่อนได้ด้วยเท่ากัน",
        "<b>บ้านเพื่อนเห็นตรงกัน</b> ทุกคนบนเกาะส่วนตัวเห็นฟาร์ม สิ่งก่อสร้าง และสัตว์เหมือนกันแบบสดๆ",
        "<b>จัดบ้านง่ายขึ้น</b> ในโหมดสร้าง แตะหรือคลิกที่พื้นตรงไหนก็ได้เพื่อวางของ",
        "<b>ดับกองไฟได้</b> กด X หรือปุ่ม \"ดับกองไฟ\" และไม่ติดอยู่ในกองไฟตอนเกิดอีกแล้ว",
        "<b>ตัดตอไม้ออกได้</b> ใช้ขวานฟันตอ 2 ที แล้วต้นไม้ใหม่จะไปงอกที่อื่นบนเกาะ",
        "<b>มือถือแนวนอน</b> มีปุ่ม \"เต็มจอแนวนอน\" ที่มุมล่างซ้าย",
      ] },
    ];
    (function () {
      var news = document.getElementById("news"), latest = UPDATES[0];
      if (!latest) return;
      function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
      var hidden = null;
      try { hidden = JSON.parse(localStorage.getItem("newsHidden") || "null"); } catch (e) {}
      if (hidden && hidden.id === latest.id && hidden.day === today()) return; // closed for today
      document.getElementById("news-date").textContent = "อัปเดตวันที่ " + latest.date;
      document.getElementById("news-list").innerHTML = latest.items.map(function (t) { return "<li>" + t + "</li>"; }).join("");
      function close() { news.classList.remove("show"); canvas.focus(); }
      document.getElementById("news-ok").addEventListener("click", close);
      document.getElementById("news-today").addEventListener("click", function () {
        try { localStorage.setItem("newsHidden", JSON.stringify({ id: latest.id, day: today() })); } catch (e) {}
        close();
      });
      // keys typed while it's open belong to it, not to the game behind
      news.addEventListener("keydown", function (e) { e.stopPropagation(); if (e.key === "Escape") close(); });
      news.classList.add("show");
      document.getElementById("news-ok").focus();
    })();

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/docs.data.unityweb?v=20261117191215",
      frameworkUrl: buildUrl + "/docs.framework.js.unityweb?v=20261117191215",
      codeUrl: buildUrl + "/docs.wasm.unityweb?v=20261117191215",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Island Survival",
      productVersion: "1.0",
      showBanner: showBanner,
      // Sharp on high-density screens, but no more than 2x so phones stay smooth.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // Save files (and deleting them when you die) reach the browser's storage right away.
      autoSyncPersistentDataPath: true,
    };

    // Keyboard goes to the game after any click/tap on it.
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    // right click is the special power in the game: no browser menu over it
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // Which server to play on. The PC running Server/start-online.bat writes its current address
    // into server.txt next to this page (the free tunnel address changes every time it starts).
    // A server given in the address (?server=...) wins, except an old tunnel address, which is
    // swapped for the latest one so bookmarks keep working.
    function pickServer(then) {
      var host = location.hostname, params = new URLSearchParams(location.search), cur = params.get("server") || "";
      if (host === "localhost" || host === "127.0.0.1" || /trycloudflare\.com$/.test(host)) return then();
      if (cur && !/trycloudflare\.com/.test(cur)) return then();
      fetch("server.txt?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) {
          t = (t || "").trim();
          if (/^wss?:\/\/\S+$/.test(t) && t !== cur) {
            params.set("server", t);
            history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
          }
        })
        .catch(function () {})
        .then(then);
    }

    pickServer(function () {
    var script = document.createElement("script");
    script.src = buildUrl + "/docs.loader.js?v=20261117191215";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        showBanner("โหลดเกมไม่สำเร็จ: " + message, "error");
      });
    };
    document.body.appendChild(script);
    });
  </script>
</body>
</html>
