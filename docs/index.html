<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Island Survival</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1c2c; }
    body { font-family: "Kanit", "Leelawadee UI", "Tahoma", sans-serif; color: #f5e6b8; }
    /* The game fills the whole browser window at any size; Unity follows the canvas size. */
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
    #loading h1 { margin: 0; font-size: clamp(24px, 6vw, 44px); color: #ffe08a; text-shadow: 2px 2px 0 #000; }
    #bar { width: min(360px, 80vw); height: 14px; border: 2px solid #ffe08a; background: #1d3347; }
    #fill { width: 0; height: 100%; background: #ffd34d; transition: width .2s; }
    #msg { font-size: 15px; opacity: .85; }
    #note { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; font-size: 14px; text-align: center; background: rgba(0,0,0,.7); display: none; }
    #error { color: #ff9a8a; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading">
    <h1>Island Survival</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">กำลังโหลดเกม...</div>
  </div>
  <div id="note"></div>
  <script>
    var canvas = document.getElementById("game");
    var note = document.getElementById("note");
    var touch = matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;

    // Phones and tablets: the game is played with a keyboard; ask for landscape to get more room.
    function updateNote() {
      var portrait = window.innerHeight > window.innerWidth;
      var text = "";
      if (touch && portrait) text = "หมุนจอเป็นแนวนอนเพื่อให้เห็นเกมเต็มจอ";
      note.textContent = text;
      note.style.display = text ? "block" : "none";
    }
    window.addEventListener("resize", updateNote);
    updateNote();
    if (touch) setTimeout(function () { if (window.innerHeight <= window.innerWidth) note.style.display = "none"; }, 8000);

    function showBanner(msg, type) {
      if (type === "error") { document.getElementById("msg").innerHTML = '<span id="error">' + msg + "</span>"; }
      else console.warn(msg);
    }

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/docs.data.unityweb",
      frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
      codeUrl: buildUrl + "/docs.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Island Survival",
      productVersion: "1.0",
      showBanner: showBanner,
      // Sharp on high-density screens, but no more than 2x so phones stay smooth.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    // Keyboard goes to the game after any click/tap on it.
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });

    var script = document.createElement("script");
    script.src = buildUrl + "/docs.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        showBanner("โหลดเกมไม่สำเร็จ: " + message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
